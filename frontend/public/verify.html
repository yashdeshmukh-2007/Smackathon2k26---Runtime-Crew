<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>On-Chain Campaign Verifier</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="max-w-md w-full bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl">
    <div class="mb-6">
      <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">
        Independent Campaign Verifier
      </h1>
      <p class="text-xs text-slate-400 mt-1">
        Read live data directly from the local RPC node (Localhost:8545).
      </p>
    </div>
<--hi there-->
    <div class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-2">
          Enter Campaign ID
        </label>
        <input 
          type="text" 
          id="campaignInput" 
          placeholder="e.g. flood-relief-2026"
          class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500"
        />
      </div>

      <button 
        onclick="verifyCampaign()" 
        class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm rounded-xl transition-all shadow-lg shadow-indigo-600/30"
      >
        Verify On-Chain
      </button>
    </div>

    <!-- Results Box -->
    <div id="results" class="mt-6 hidden space-y-3 p-4 bg-slate-900/60 border border-slate-700/80 rounded-xl">
      <div>
        <span class="block text-[10px] font-semibold text-slate-400 uppercase">Registration Status</span>
        <span id="resStatus" class="text-xs font-bold text-emerald-400"></span>
      </div>
      <div>
        <span class="block text-[10px] font-semibold text-slate-400 uppercase">Beneficiary Address</span>
        <span id="resBeneficiary" class="text-xs font-mono text-indigo-300 break-all"></span>
      </div>
      <div>
        <span class="block text-[10px] font-semibold text-slate-400 uppercase">Total Raised</span>
        <span id="resRaised" class="text-sm font-bold text-white"></span>
      </div>
    </div>

    <div id="statusMessage" class="mt-4 text-center text-xs text-slate-400 hidden"></div>
  </div>

  <script>
    // Configured for local development
    const CONTRACT_ADDRESS = "0x5FbDB2315678afecb367f032d93F642f64180aa3";
    const RPC_URL = "http://127.0.0.1:8545";

    const CONTRACT_ABI = [
      "function getIsCampaignRegistered(string calldata _campaignId) external view returns (bool)",
      "function getCampaignBeneficiary(string calldata _campaignId) external view returns (address beneficiary)",
      "function getTotalRaisedForCampaign(string calldata _campaignId) external view returns (uint256 total)"
    ];

    async function verifyCampaign() {
      const campaignId = document.getElementById("campaignInput").value.trim();
      const resultsDiv = document.getElementById("results");
      const statusMsg = document.getElementById("statusMessage");

      if (!campaignId) {
        alert("Please enter a campaign ID.");
        return;
      }

      statusMsg.textContent = "Connecting to local blockchain...";
      statusMsg.classList.remove("hidden");
      resultsDiv.classList.add("hidden");

      try {
        const provider = new ethers.JsonRpcProvider(RPC_URL);
        const contract = new ethers.Contract(CONTRACT_ADDRESS, CONTRACT_ABI, provider);

        const isRegistered = await contract.getIsCampaignRegistered(campaignId);

        if (!isRegistered) {
          statusMsg.textContent = `Campaign "${campaignId}" is NOT registered on-chain.`;
          return;
        }

        const beneficiary = await contract.getCampaignBeneficiary(campaignId);
        const raisedWei = await contract.getTotalRaisedForCampaign(campaignId);

        document.getElementById("resStatus").textContent = "REGISTERED & VERIFIED";
        document.getElementById("resBeneficiary").textContent = beneficiary;
        document.getElementById("resRaised").textContent = `${ethers.formatEther(raisedWei)} ETH`;

        statusMsg.classList.add("hidden");
        resultsDiv.classList.remove("hidden");
      } catch (err) {
        console.error(err);
        statusMsg.textContent = "Failed to query RPC node. Ensure Hardhat node is running at 127.0.0.1:8545.";
      }
    }
  </script>
</body>
</html>
